<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c53536" />
    <title>Operation Agents - offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6fb; color: #222529; font-family: system-ui, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
      p { color: #6b6969; line-height: 1.5; margin: 0 0 1.25rem; }
      button { height: 44px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: #ea4d4e; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Operation Agents needs a connection to show orders and approvals. Nothing you did was lost. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
